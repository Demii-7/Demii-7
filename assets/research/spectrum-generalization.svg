<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Spectrum prediction research diagram</title>
  <desc id="desc">A technical diagram showing the flow from multi testbed spectrum measurements to observations, forecasting models, future predictions, and controlled evaluation across time, frequency, space, and transfer generalization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#071019" />
      <stop offset="100%" stop-color="#0b1520" />
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="860" rx="28" fill="url(#bg)" />
  <rect x="20" y="20" width="1160" height="820" rx="22" fill="none" stroke="#1f3144" stroke-width="1.5" />

  <text x="600" y="64" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Spectrum Prediction Model Evaluation</text>
  <text x="600" y="96" text-anchor="middle" fill="#9fb2c7" font-family="Arial, Helvetica, sans-serif" font-size="16">Controlled benchmark design for learning and generalization</text>

  <g transform="translate(140 128)">
    <rect x="0" y="0" width="920" height="430" rx="20" fill="#0a111a" stroke="#223446" stroke-width="1.5" />

    <g transform="translate(60 36)">
      <rect x="220" y="0" width="360" height="72" rx="16" fill="#0f1724" stroke="#38bdf8" stroke-width="1.6" />
      <text x="400" y="29" text-anchor="middle" fill="#e5eef7" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">MULTI-TESTBED SPECTRUM MEASUREMENTS</text>
      <text x="400" y="50" text-anchor="middle" fill="#9fb2c7" font-family="Arial, Helvetica, sans-serif" font-size="13">illustrative inputs from multiple environments</text>

      <path d="M400 72 V110" stroke="url(#accent)" stroke-width="2.2" />
      <path d="M392 100 L400 110 L408 100" fill="none" stroke="url(#accent)" stroke-width="2.2" />

      <rect x="170" y="110" width="460" height="92" rx="16" fill="#0f1724" stroke="#38bdf8" stroke-width="1.4" />
      <text x="400" y="144" text-anchor="middle" fill="#e5eef7" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">PAST SPECTRUM OBSERVATIONS</text>
      <text x="400" y="165" text-anchor="middle" fill="#9fb2c7" font-family="Arial, Helvetica, sans-serif" font-size="13">history windows used as forecasting context</text>

      <g transform="translate(214 127)">
        <rect x="0" y="0" width="72" height="50" rx="8" fill="#09131d" stroke="#294154" stroke-width="1" />
        <rect x="86" y="0" width="72" height="50" rx="8" fill="#09131d" stroke="#294154" stroke-width="1" />
        <rect x="172" y="0" width="72" height="50" rx="8" fill="#09131d" stroke="#294154" stroke-width="1" />
        <rect x="258" y="0" width="72" height="50" rx="8" fill="#09131d" stroke="#294154" stroke-width="1" />
        <rect x="344" y="0" width="72" height="50" rx="8" fill="#09131d" stroke="#294154" stroke-width="1" />
        <g opacity="0.9">
          <path d="M10 38 C18 30, 28 14, 38 18 S54 40, 62 24" fill="none" stroke="#67e8f9" stroke-width="2" />
          <path d="M96 34 C106 18, 116 22, 126 28 S142 40, 148 16" fill="none" stroke="#93c5fd" stroke-width="2" />
          <path d="M182 36 C194 10, 202 14, 214 24 S230 42, 236 20" fill="none" stroke="#67e8f9" stroke-width="2" />
          <path d="M268 38 C278 24, 288 14, 300 18 S318 38, 322 26" fill="none" stroke="#93c5fd" stroke-width="2" />
          <path d="M354 34 C366 28, 378 12, 388 16 S406 36, 414 18" fill="none" stroke="#67e8f9" stroke-width="2" />
        </g>
      </g>

      <path d="M400 202 V240" stroke="url(#accent)" stroke-width="2.2" />
      <path d="M392 230 L400 240 L408 230" fill="none" stroke="url(#accent)" stroke-width="2.2" />

      <rect x="250" y="240" width="300" height="78" rx="16" fill="#0f1724" stroke="#38bdf8" stroke-width="1.5" />
      <text x="400" y="273" text-anchor="middle" fill="#e5eef7" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">FORECASTING MODELS</text>
      <text x="400" y="294" text-anchor="middle" fill="#9fb2c7" font-family="Arial, Helvetica, sans-serif" font-size="13">benchmarking multiple model families</text>
      <path d="M306 280 H494" stroke="#294154" stroke-width="1.1" />
      <path d="M332 262 V298 M400 262 V298 M468 262 V298" stroke="#67e8f9" stroke-width="1.6" opacity="0.85" />

      <path d="M400 318 V356" stroke="url(#accent)" stroke-width="2.2" />
      <path d="M392 346 L400 356 L408 346" fill="none" stroke="url(#accent)" stroke-width="2.2" />

      <rect x="210" y="356" width="380" height="74" rx="16" fill="#0f1724" stroke="#38bdf8" stroke-width="1.5" />
      <text x="400" y="388" text-anchor="middle" fill="#e5eef7" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">FUTURE SPECTRUM PREDICTIONS</text>
      <text x="400" y="409" text-anchor="middle" fill="#9fb2c7" font-family="Arial, Helvetica, sans-serif" font-size="13">forecast outputs evaluated without fabricated values</text>
    </g>
  </g>

  <g transform="translate(110 592)">
    <rect x="0" y="0" width="980" height="176" rx="20" fill="#0a111a" stroke="#223446" stroke-width="1.5" />
    <text x="490" y="34" text-anchor="middle" fill="#e5eef7" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">CONTROLLED EVALUATION</text>

    <g transform="translate(36 60)">
      <rect x="0" y="0" width="205" height="74" rx="14" fill="#0f1724" stroke="#38bdf8" stroke-width="1.4" />
      <text x="102.5" y="31" text-anchor="middle" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">TIME</text>
      <text x="102.5" y="52" text-anchor="middle" fill="#9fb2c7" font-family="Arial, Helvetica, sans-serif" font-size="12">temporal structure</text>

      <rect x="246" y="0" width="205" height="74" rx="14" fill="#0f1724" stroke="#38bdf8" stroke-width="1.4" />
      <text x="348.5" y="31" text-anchor="middle" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">FREQUENCY</text>
      <text x="348.5" y="52" text-anchor="middle" fill="#9fb2c7" font-family="Arial, Helvetica, sans-serif" font-size="12">spectral structure</text>

      <rect x="492" y="0" width="205" height="74" rx="14" fill="#0f1724" stroke="#38bdf8" stroke-width="1.4" />
      <text x="594.5" y="31" text-anchor="middle" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">SPACE</text>
      <text x="594.5" y="52" text-anchor="middle" fill="#9fb2c7" font-family="Arial, Helvetica, sans-serif" font-size="12">spatial variation</text>

      <rect x="738" y="0" width="205" height="74" rx="14" fill="#0f1724" stroke="#38bdf8" stroke-width="1.4" />
      <text x="840.5" y="25" text-anchor="middle" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">TRANSFER /</text>
      <text x="840.5" y="46" text-anchor="middle" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">GENERALIZATION</text>
      <text x="840.5" y="64" text-anchor="middle" fill="#9fb2c7" font-family="Arial, Helvetica, sans-serif" font-size="12">across environments</text>
    </g>

    <path d="M490 0 V-34" stroke="url(#accent)" stroke-width="2.2" transform="translate(0 0)" />
  </g>

  <g transform="translate(240 792)">
    <rect x="0" y="0" width="720" height="40" rx="20" fill="#09131d" stroke="#294154" stroke-width="1.2" />
    <text x="360" y="26" text-anchor="middle" fill="#dbe4ee" font-family="Arial, Helvetica, sans-serif" font-size="18" filter="url(#softGlow)">Do strong predictions reflect meaningful learned patterns?</text>
  </g>
</svg>
