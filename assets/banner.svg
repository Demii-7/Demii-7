<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Demarce Williams profile banner</title>
  <desc id="desc">A dark engineering themed banner connecting signals, sensing, computation, control, and robotics with schematic style graphics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#06090f" />
      <stop offset="100%" stop-color="#0d1521" />
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#4fd1ff" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="420" rx="28" fill="url(#bg)" />
  <rect x="20" y="20" width="1560" height="380" rx="20" fill="none" stroke="#1f3144" stroke-width="1.5" />

